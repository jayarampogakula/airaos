<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiraOS Live AI Assistant</title>
  <style>
    :root {
      --primary-color: #0ea5e9;
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --border-glass: rgba(255, 255, 255, 0.08);
      --card-bg: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
    }

    /* Widget Layout */
    header {
      padding: 16px;
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.95) 0%, rgba(9, 15, 30, 0.95) 100%);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      border: 2px solid rgba(255,255,255,0.15);
      object-fit: cover;
    }

    .title-area h2 {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .title-area p {
      font-size: 0.7rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.25rem;
      cursor: pointer;
      display: none;
    }

    @media (max-width: 480px) {
      .close-btn {
        display: block;
      }
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border-glass);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
    }

    .tab.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      background: rgba(255,255,255,0.02);
    }

    /* Panels */
    .panel {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      position: relative;
    }

    .panel.active {
      display: flex;
    }

    /* Chat Panel */
    .messages-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.8rem;
      line-height: 1.45;
      word-wrap: break-word;
    }

    .message.ai {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.customer {
      background: var(--primary-color);
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      border-bottom-left-radius: 2px;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--text-secondary);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Footer */
    .chat-footer {
      padding: 12px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-glass);
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 10px 16px;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    .chat-input::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-color);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    /* Booking Panel */
    .booking-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-input {
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 10px 12px;
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    .slots-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glass);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .slot-card:hover {
      border-color: var(--primary-color);
      background: rgba(255,255,255,0.05);
    }

    .slot-card.selected {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .btn-action {
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .success-booking {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .success-icon {
      font-size: 3rem;
      color: #10b981;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="header-info">
      <div id="agent-avatar" class="avatar">🤖</div>
      <div class="title-area">
        <h2 id="widget-title">AI Assistant</h2>
        <p><span class="status-dot"></span> Active Receptionist</p>
      </div>
    </div>
    <button class="close-btn" onclick="closeWidget()">✕</button>
  </header>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <div id="tab-chat" class="tab active" onclick="switchTab('chat')">AI Chat</div>
    <div id="tab-book" class="tab" onclick="switchTab('book')">Book Slot</div>
  </div>

  <!-- Chat Panel -->
  <div id="panel-chat" class="panel active">
    <div class="messages-list" id="messages-list">
      <!-- Dynamic Messages -->
    </div>
    <div class="typing-indicator" id="typing-indicator">
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <!-- Chat Footer -->
  <div id="footer-chat" class="chat-footer">
    <input type="text" id="chat-input" class="chat-input" placeholder="Type your query..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendChatMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <!-- Booking Panel -->
  <div id="panel-book" class="panel">
    <div class="booking-container" id="booking-container">
      <div class="form-group">
        <label class="form-label">Pick Appointment Date</label>
        <input type="date" id="booking-date" class="form-input" onchange="loadAvailability()">
      </div>

      <div class="form-group">
        <label class="form-label">Available Timeslots</label>
        <div id="slots-list" class="slots-grid">
          <!-- Availability slots -->
          <div style="grid-column: span 2; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding: 10px;">Select a date to check availability.</div>
        </div>
      </div>

      <div id="booking-form" style="display: none; flex-direction: column; gap: 10px; margin-top: 10px; border-top: 1px solid var(--border-glass); padding-top: 14px;">
        <div class="form-group">
          <label class="form-label">Your Full Name</label>
          <input type="text" id="client-name" class="form-input" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="client-email" class="form-input" placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" id="client-phone" class="form-input" placeholder="+1 (555) 012-3456">
        </div>
        <button class="btn-action" onclick="submitBooking()">Confirm Reservation</button>
      </div>
    </div>

    <!-- Booking Complete Success UI -->
    <div id="booking-success" class="success-booking" style="display: none;">
      <div class="success-icon">✓</div>
      <h3>Booking Confirmed!</h3>
      <p id="success-message" style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.4; margin-top: 8px;">
        Your reservation has been saved in the system. Our staff will follow up shortly.
      </p>
      <button class="btn-action" style="margin-top: 12px; width: auto; padding: 8px 20px;" onclick="resetBookingFlow()">Schedule Another</button>
    </div>
  </div>

  <script>
    // Parse query params
    const params = new URLSearchParams(window.location.search);
    const tenantId = params.get('tenantId') || 't-1';
    const widgetColor = params.get('color') || '#0ea5e9';
    const widgetTitle = params.get('title') || 'AI Assistant';

    // Apply customizations
    document.documentElement.style.setProperty('--primary-color', widgetColor);
    document.getElementById('widget-title').innerText = widgetTitle;

    let agents = [];
    let activeAgent = null;
    let selectedSlot = null;

    // Load active agent data on mount
    async function init() {
      try {
        const response = await fetch('/api/agents');
        if (response.ok) {
          agents = await response.json();
          // Find matching agent (a-1 for t-1, a-2 for t-2, a-3 for t-3)
          const targetId = tenantId === 't-1' ? 'a-1' : tenantId === 't-2' ? 'a-2' : tenantId === 't-3' ? 'a-3' : 'a-1';
          activeAgent = agents.find(a => a.id === targetId) || agents[0];
          
          if (activeAgent) {
            document.getElementById('agent-avatar').innerText = activeAgent.avatar ? '' : '🤖';
            if (activeAgent.avatar) {
              const img = document.createElement('img');
              img.src = activeAgent.avatar;
              img.className = 'avatar';
              document.getElementById('agent-avatar').appendChild(img);
            }
            
            // Set initial AI greeting
            addMessage(`Hi! I am ${activeAgent.name}, the AI receptionist. How can I help you today?`, 'ai');
          }
        }
      } catch (e) {
        console.error(e);
        addMessage("Hello! I am your AiraOS AI digital coordinator. How can I help you today?", "ai");
      }

      // Default the datepicker to tomorrow
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('booking-date').value = tomorrow.toISOString().substring(0, 10);
      loadAvailability();
    }

    function switchTab(tabName) {
      document.getElementById('tab-chat').classList.remove('active');
      document.getElementById('tab-book').classList.remove('active');
      document.getElementById('panel-chat').classList.remove('active');
      document.getElementById('panel-book').classList.remove('active');
      document.getElementById('footer-chat').style.display = 'none';

      document.getElementById(`tab-${tabName}`).classList.add('active');
      document.getElementById(`panel-${tabName}`).classList.add('active');
      
      if (tabName === 'chat') {
        document.getElementById('footer-chat').style.display = 'flex';
      }
    }

    function closeWidget() {
      window.parent.postMessage('airaos-widget-close', '*');
    }

    // Message Rendering Helpers
    const messagesList = document.getElementById('messages-list');
    
    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      msgDiv.innerText = text;
      messagesList.appendChild(msgDiv);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    // Chat logic
    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'customer');
      input.value = '';

      const typing = document.getElementById('typing-indicator');
      typing.style.display = 'block';
      messagesList.scrollTop = messagesList.scrollHeight;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            tenantId: tenantId,
            agentId: activeAgent ? activeAgent.id : 'a-1'
          })
        });

        typing.style.display = 'none';

        if (response.ok) {
          const data = await response.json();
          addMessage(data.text, 'ai');
        } else {
          addMessage("I am having trouble connecting right now. Can I help you with something else?", 'ai');
        }
      } catch (err) {
        typing.style.display = 'none';
        addMessage("I am currently operating in offline mode. Let me know if you would like to book an appointment slot instead!", 'ai');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendChatMessage();
      }
    }

    // Scheduling/Booking availability loading
    async function loadAvailability() {
      const dateVal = document.getElementById('booking-date').value;
      const slotsList = document.getElementById('slots-list');
      
      if (!dateVal) return;

      slotsList.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding: 10px;">Loading availability...</div>';

      try {
        const response = await fetch(`/api/availability?tenantId=${tenantId}&date=${dateVal}`);
        if (response.ok) {
          const slots = await response.json();
          slotsList.innerHTML = '';
          
          if (slots.length === 0) {
            slotsList.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding: 10px;">No available slots for this date.</div>';
            return;
          }

          slots.forEach(slot => {
            const card = document.createElement('div');
            card.className = 'slot-card';
            card.innerText = slot;
            card.onclick = () => selectSlot(slot, card);
            slotsList.appendChild(card);
          });
        } else {
          slotsList.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding: 10px;">Failed to load timeslots.</div>';
        }
      } catch(err) {
        slotsList.innerHTML = '<div style="grid-column: span 2; text-align: center; color: var(--text-secondary); font-size: 0.75rem; padding: 10px;">Offline mode. Select another date.</div>';
      }
    }

    function selectSlot(slot, element) {
      selectedSlot = slot;
      
      // Deselect all
      document.querySelectorAll('.slot-card').forEach(c => c.classList.remove('selected'));
      element.classList.add('selected');

      // Show booking form
      document.getElementById('booking-form').style.display = 'flex';
      document.getElementById('booking-form').scrollIntoView({ behavior: 'smooth' });
    }

    // Submit Reservation
    async function submitBooking() {
      const name = document.getElementById('client-name').value.trim();
      const email = document.getElementById('client-email').value.trim();
      const phone = document.getElementById('client-phone').value.trim();
      const dateVal = document.getElementById('booking-date').value;

      if (!name || !email || !phone) {
        alert("Please fill in all details to reserve the slot.");
        return;
      }

      // Convert standard time (e.g. "02:30 PM") to ISO structure "YYYY-MM-DDTHH:MM"
      let [time, modifier] = selectedSlot.split(' ');
      let [hours, minutes] = time.split(':');
      if (hours === '12') hours = '00';
      if (modifier === 'PM') hours = parseInt(hours, 10) + 12;
      const timeStr = `${hours.toString().padStart(2, '0')}:${minutes.padStart(2, '0')}`;
      const dateTimeStr = `${dateVal}T${timeStr}`;

      try {
        // Step 1: Create or fetch contact in CRM
        const contactResponse = await fetch('/api/contacts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name,
            email,
            phone,
            company: 'Web Widget Booking',
            tags: ['Widget Booking'],
            notes: [`Self-scheduled from website widget.`]
          })
        });

        if (!contactResponse.ok) throw new Error("Failed to sync CRM contact");
        const contact = await contactResponse.json();

        // Step 2: Book appointment
        const appointmentResponse = await fetch('/api/appointments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contactId: contact.id,
            agentId: activeAgent ? activeAgent.id : 'a-1',
            dateTime: dateTimeStr,
            duration: 30,
            location: tenantId === 't-1' ? 'Suite A Clinic Office' : 'Corporate Suite Tour Room',
            type: tenantId === 't-1' ? 'Dental Consultation' : 'Showroom Tour',
          })
        });

        if (appointmentResponse.ok) {
          // Display success state
          document.getElementById('booking-container').style.display = 'none';
          document.getElementById('booking-success').style.display = 'flex';
          document.getElementById('success-message').innerText = `Your session is reserved for ${new Date(dateTimeStr).toLocaleDateString()} at ${selectedSlot}. A notification note is sent to the CRM portal.`;
        } else {
          alert("Slot is no longer available. Please select another slot.");
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred during booking. Please try again.");
      }
    }

    function resetBookingFlow() {
      document.getElementById('booking-container').style.display = 'flex';
      document.getElementById('booking-success').style.display = 'none';
      document.getElementById('booking-form').style.display = 'none';
      
      // Reset inputs
      document.getElementById('client-name').value = '';
      document.getElementById('client-email').value = '';
      document.getElementById('client-phone').value = '';
      selectedSlot = null;

      loadAvailability();
    }

    // Run on startup
    init();
  </script>
</body>
</html>
